# =============================================================================
# vmware_exporter - example configuration
# Compatible with vCenter 8.x and vCenter 9.x (VCF 9 / VVF 9).
#
# Never write secrets in clear text here: use password_file (recommended,
# file mode 0600) or password_env. The ${VARIABLE} syntax is interpolated
# from the environment everywhere.
# Validate the file: vmware_exporter -config.file config.yml -config.check
# =============================================================================

listen_address: ":9272"        # HTTP listen address for /metrics
telemetry_path: /metrics
log_level: info                # debug | info | warn | error
log_format: text               # text | json

# Access to the HTTP endpoints. Without web_config_file they are public.
# To require a password (and/or HTTPS), point to a Prometheus web configuration
# file (see deploy/web-config.example.yml):
# web_config_file: /etc/vmware-exporter/web-config.yml

# Alternative without authentication: serve over HTTPS only
# (mutually exclusive with web_config_file, which can also set up TLS)
# web_tls:
#   cert_file: /etc/vmware-exporter/tls/exporter.crt
#   key_file:  /etc/vmware-exporter/tls/exporter.key

# -----------------------------------------------------------------------------
# Common settings inherited by every target (can be overridden per target)
# -----------------------------------------------------------------------------
defaults:
  # Read-only service account. On VCF 9 with identity federation
  # (VCF Identity Broker, ADFS, Entra ID...), use a LOCAL SSO account
  # (e.g. svc-prometheus@vsphere.local): the SOAP API does not accept federated accounts.
  username: ${VMWARE_EXPORTER_USER}
  password_file: /etc/vmware-exporter/vcenter.pass
  # password_env: VMWARE_EXPORTER_PASSWORD

  # TLS: provide the CA (VMCA or enterprise PKI) rather than disabling verification.
  ca_file: /etc/vmware-exporter/ca.pem
  insecure_skip_verify: false
  tls_min_version: "1.2"       # "1.3" also possible (secure default on vCenter 9)

  interval: 60s                # collection period (>= 20s, vSphere real-time granularity)
  # timeout: 55s               # default = interval - 5s

  # force_api_version: "8.0.3.0"   # troubleshooting only; otherwise negotiated automatically

  collectors:
    vcenter: true        # vCenter info, TLS certificate, sessions
    alarms: true         # active vCenter alarms (all entities) -> basis for alerting
    datacenter: true
    cluster: true        # HA, DRS, capacity, DRS score
    host: true           # ESX: state, IPMI sensors, storage paths, uplinks, services, certificates
    vm: true             # VM: state, tools, heartbeat, snapshots, guest disks
    datastore: true      # capacity, accessibility, datastore clusters
    network: true        # vDS (ESX sync status), portgroups
    resourcepool: true
    perf: true           # real-time counters (CPU ready, latencies, network...)
    vsan: true           # vSAN health (cached health service results)
    appliance: true      # VAMI health, vCenter services, backups (REST API /api)
    pryorda: false       # also emit pryorda/vmware_exporter metric names/labels (existing dashboards)

  filters:
    # vm_exclude: "^(vCLS|SupervisorControlPlaneVM)"
    # vm_include: ".*"
    # host_exclude: ""
    # datastore_exclude: "^(local|datastore1)"
    exclude_system_vms: false    # true = skip solution-managed VMs (vCLS, Supervisor, EAM agents)
    include_templates: false

  host:
    sensors: true                # IPMI/CIM hardware sensors
    storage_paths: true          # multipath path counts (dead, lost redundancy)
    services: [TSM-SSH, TSM, ntpd, chronyd, vpxa, hostd]

  perf:
    # Real-time counters (vSphere name group.counter.rollup). Suffix ":*" = all instances.
    # Leave empty for the defaults (see README).
    # host_counters: [cpu.usage.average, mem.usage.average, "datastore.totalReadLatency.average:*"]
    # vm_counters:   [cpu.ready.summation, cpu.usage.average, disk.maxTotalLatency.latest]
    batch_size: 100              # entities per QueryPerf request
    max_concurrency: 4           # parallel QueryPerf requests per vCenter

  extra_labels:                  # static labels added to every series
    env: prod

# -----------------------------------------------------------------------------
# vCenters to monitor (8.x and 9.x can coexist)
# -----------------------------------------------------------------------------
targets:
  - name: vc8-site-a                     # value of the "vcenter" label
    url: vcenter-a.example.local         # or https://vcenter-a.example.local/sdk
    extra_labels: {site: a}

  - name: vcf9-mgmt
    url: vcf9-mgmt-vc.example.local
    tls_min_version: "1.3"
    extra_labels: {site: b}

  - name: vcf9-wld01
    url: vcf9-wld01-vc.example.local
    password_file: /etc/vmware-exporter/vcf9-wld01.pass   # separate account for this domain
    interval: 120s                                        # large workload domain: collect less often
    filters:
      exclude_system_vms: true
    extra_labels: {site: b}
