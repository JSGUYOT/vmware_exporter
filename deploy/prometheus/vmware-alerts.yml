# Prometheus alerting rules for vmware_exporter (vCenter 8.x / VCF 9.x).
#
# Two complementary alert sources:
#   1. Native vCenter alarms (vmware_alarm_triggered), forwarded as-is:
#      everything vCenter can detect (including vSAN, NSX, certificates, licenses...)
#      reaches Alertmanager without having to redefine it.
#   2. Prometheus-native rules on metrics (thresholds, trends, redundancy),
#      covering what vCenter alarms miss or handle poorly.
#
# Thresholds are sensible starting points: tune them to your environment.
# Severity labels: critical (act now), warning (needs attention), info (for the record).

groups:
  # ---------------------------------------------------------------------------
  - name: vmware_exporter
    rules:
      - alert: VMwareExporterTargetDown
        expr: vmware_up == 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "vCenter {{ $labels.vcenter }} unreachable from the exporter"
          description: "Connection or authentication to {{ $labels.vcenter }} has been failing for 5 min. Check vCenter, the network and the service account."

      - alert: VMwareExporterScrapeFailed
        expr: up{job=~".*vmware.*"} == 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "VMware exporter {{ $labels.instance }} is not being scraped"
          description: "Prometheus can no longer read /metrics on {{ $labels.instance }}."

      - alert: VMwareExporterStaleData
        expr: time() - vmware_collection_timestamp_seconds > 600
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Stale VMware data for {{ $labels.vcenter }}"
          description: "No collection has completed for {{ $value | humanizeDuration }}. Collection may be stuck (timeout too short, vCenter very slow)."

      - alert: VMwareExporterCollectorFailing
        expr: vmware_collector_success == 0
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "Collector {{ $labels.collector }} failing on {{ $labels.vcenter }}"
          description: "Collector {{ $labels.collector }} has been failing for 15 min (service account permissions, missing endpoint, timeout). Check the exporter logs."

      - alert: VMwareExporterSlowCollection
        expr: vmware_collection_duration_seconds > 50
        for: 15m
        labels: {severity: info}
        annotations:
          summary: "Slow collection on {{ $labels.vcenter }} ({{ $value | humanize }}s)"
          description: "Increase 'interval'/'timeout' or reduce the scope (filters, perf counters)."

  # ---------------------------------------------------------------------------
  - name: vmware-vcenter
    rules:
      - alert: VMwareVCenterAlarmCritical
        expr: vmware_alarm_triggered{status="red", acknowledged="false"} == 3
        for: 2m
        labels: {severity: critical, source: vcenter}
        annotations:
          summary: "[{{ $labels.vcenter }}] {{ $labels.alarm }} on {{ $labels.entity }}"
          description: "RED vCenter alarm '{{ $labels.alarm }}' on {{ $labels.entity_type }} {{ $labels.entity }} (datacenter {{ $labels.dc_name }})."

      - alert: VMwareVCenterAlarmWarning
        expr: vmware_alarm_triggered{status="yellow", acknowledged="false"} == 2
        for: 10m
        labels: {severity: warning, source: vcenter}
        annotations:
          summary: "[{{ $labels.vcenter }}] {{ $labels.alarm }} on {{ $labels.entity }}"
          description: "YELLOW vCenter alarm '{{ $labels.alarm }}' on {{ $labels.entity_type }} {{ $labels.entity }} (datacenter {{ $labels.dc_name }})."

      - alert: VMwareVCenterCertificateExpiringSoon
        expr: (vmware_vcenter_certificate_expiry_timestamp_seconds - time()) < 30 * 86400
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "TLS certificate of {{ $labels.vcenter }} expires in {{ $value | humanizeDuration }}"
          description: "Renew the vCenter machine SSL certificate."

      - alert: VMwareVCenterCertificateExpiryCritical
        expr: (vmware_vcenter_certificate_expiry_timestamp_seconds - time()) < 7 * 86400
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: "TLS certificate of {{ $labels.vcenter }} expires in {{ $value | humanizeDuration }}"
          description: "The vCenter machine SSL certificate is about to expire."

      - alert: VMwareApplianceHealthDegraded
        expr: vmware_appliance_health >= 2
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Appliance {{ $labels.vcenter }}: component {{ $labels.component }} degraded"
          description: "VAMI health of component {{ $labels.component }} is yellow/orange (value {{ $value }})."

      - alert: VMwareApplianceHealthCritical
        expr: vmware_appliance_health == 3
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Appliance {{ $labels.vcenter }}: component {{ $labels.component }} in error"
          description: "VAMI health of component {{ $labels.component }} is red."

      - alert: VMwareApplianceServiceStopped
        expr: vmware_appliance_service_started{startup_type="automatic"} == 0
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: "vCenter service {{ $labels.service }} stopped on {{ $labels.vcenter }}"
          description: "A service with automatic startup has been stopped for 10 min."

      - alert: VMwareApplianceServiceDegraded
        expr: vmware_appliance_service_health == 3
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "vCenter service {{ $labels.service }} degraded on {{ $labels.vcenter }}"
          description: "Service {{ $labels.service }} reports a DEGRADED state."

      - alert: VMwareVCenterBackupFailed
        expr: vmware_appliance_backup_last_succeeded == 0
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "Last backup of vCenter {{ $labels.vcenter }} failed"
          description: "The last vCenter file-based backup job did not succeed."

      - alert: VMwareVCenterBackupTooOld
        expr: time() - vmware_appliance_backup_last_success_timestamp_seconds > 26 * 3600
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "No successful backup of vCenter {{ $labels.vcenter }} for {{ $value | humanizeDuration }}"
          description: "Check the file-based backup schedule."

      - alert: VMwareVCenterNoSuccessfulBackup
        # Backup endpoint is readable but no successful job is known (or no job at all).
        expr: vmware_appliance_backup_jobs unless on(vcenter) vmware_appliance_backup_last_success_timestamp_seconds
        for: 6h
        labels: {severity: warning}
        annotations:
          summary: "No known successful backup for vCenter {{ $labels.vcenter }}"
          description: "{{ $value }} known file-based backup job(s), none succeeded. Configure or fix vCenter backups."

  # ---------------------------------------------------------------------------
  - name: vmware-cluster
    rules:
      - alert: VMwareClusterStatusRed
        expr: vmware_cluster_overall_status == 3
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Cluster {{ $labels.cluster_name }} status is red ({{ $labels.vcenter }})"
          description: "Overall status of cluster {{ $labels.cluster_name }} is red."

      - alert: VMwareClusterHADisabled
        expr: vmware_cluster_ha_enabled == 0 and vmware_cluster_hosts > 1
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "vSphere HA disabled on {{ $labels.cluster_name }}"
          description: "Cluster {{ $labels.cluster_name }} is not protected by vSphere HA."

      - alert: VMwareClusterHAFailoverCapacityLost
        # The *_configured metrics are only emitted when HA and admission control are enabled.
        expr: |
          (vmware_cluster_ha_failover_level_current < vmware_cluster_ha_failover_level_configured)
          or (vmware_cluster_ha_failover_cpu_resources_percent < vmware_cluster_ha_failover_cpu_resources_configured_percent)
          or (vmware_cluster_ha_failover_memory_resources_percent < vmware_cluster_ha_failover_memory_resources_configured_percent)
        for: 15m
        labels: {severity: critical}
        annotations:
          summary: "Cluster {{ $labels.cluster_name }}: insufficient HA failover capacity"
          description: "Available failover capacity is below the reserve configured in HA admission control: the cluster can no longer guarantee VM restarts if a host fails."

      - alert: VMwareClusterHostsUnavailable
        expr: vmware_cluster_hosts - vmware_cluster_hosts_effective > 0
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} host(s) unavailable in {{ $labels.cluster_name }}"
          description: "Hosts disconnected, in maintenance or not responding in cluster {{ $labels.cluster_name }}."

      - alert: VMwareClusterMemoryPressure
        expr: vmware_cluster_memory_demand_bytes / vmware_cluster_memory_effective_bytes > 0.90
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "Cluster {{ $labels.cluster_name }} memory at {{ $value | humanizePercentage }}"
          description: "VM memory demand is approaching the cluster's effective capacity."

      - alert: VMwareClusterCpuPressure
        expr: vmware_cluster_cpu_demand_mhz / vmware_cluster_cpu_effective_mhz > 0.85
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "Cluster {{ $labels.cluster_name }} CPU at {{ $value | humanizePercentage }}"
          description: "VM CPU demand is approaching the cluster's effective capacity."

      - alert: VMwareClusterDrsScoreLow
        expr: vmware_cluster_drs_score < 60
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "Low DRS score ({{ $value }}) on {{ $labels.cluster_name }}"
          description: "VMs in the cluster are not getting the resources they demand (contention)."

      - alert: VMwareClusterConfigIssues
        expr: vmware_cluster_config_issues > 0
        for: 1h
        labels: {severity: info}
        annotations:
          summary: "{{ $value }} configuration issue(s) on {{ $labels.cluster_name }}"
          description: "See the cluster's Summary > Configuration Issues in the vSphere Client."

  # ---------------------------------------------------------------------------
  - name: vmware-host
    rules:
      - alert: VMwareHostNotResponding
        expr: vmware_host_connection_status == 2
        for: 3m
        labels: {severity: critical}
        annotations:
          summary: "Host {{ $labels.host_name }} not responding ({{ $labels.cluster_name }})"
          description: "vCenter {{ $labels.vcenter }} is no longer receiving heartbeats from host {{ $labels.host_name }}."

      - alert: VMwareHostDisconnected
        expr: vmware_host_connection_status == 0 and vmware_host_in_maintenance == 0
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Host {{ $labels.host_name }} disconnected from vCenter"
          description: "Host {{ $labels.host_name }} is disconnected while not in maintenance mode."

      - alert: VMwareHostStatusRed
        expr: vmware_host_overall_status == 3
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Host {{ $labels.host_name }} status is red"
          description: "Overall status of host {{ $labels.host_name }} ({{ $labels.cluster_name }}) is red."

      - alert: VMwareHostMaintenanceMode
        expr: vmware_host_in_maintenance == 1
        for: 24h
        labels: {severity: info}
        annotations:
          summary: "Host {{ $labels.host_name }} in maintenance mode for over 24h"
          description: "Remember to exit maintenance mode once the work is done."

      - alert: VMwareHostQuarantine
        expr: vmware_host_quarantine_mode == 1
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Host {{ $labels.host_name }} in quarantine mode (Proactive HA)"
          description: "The hardware vendor reported a partial hardware failure."

      - alert: VMwareHostHAAgentProblem
        expr: vmware_host_ha_state{state!~"master|connectedToMaster|election"} == 1 and on(vcenter, host_name) (vmware_host_in_maintenance == 0)
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "HA agent on {{ $labels.host_name }} in state {{ $labels.state }}"
          description: "The FDM agent is unhealthy (isolation, network partition or initialization error)."

      - alert: VMwareHostSensorCritical
        expr: vmware_host_sensor_health == 3
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Sensor {{ $labels.sensor }} critical on {{ $labels.host_name }}"
          description: "Hardware sensor of type {{ $labels.type }} is red."

      - alert: VMwareHostSensorWarning
        expr: vmware_host_sensor_health == 2
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "Sensor {{ $labels.sensor }} warning on {{ $labels.host_name }}"
          description: "Hardware sensor of type {{ $labels.type }} is yellow."

      - alert: VMwareHostHardwareComponentFailed
        expr: vmware_host_hardware_status == 3
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Component {{ $labels.component }} failed on {{ $labels.host_name }}"
          description: "{{ $labels.name }} reported in error."

      - alert: VMwareHostStorageLunNoPath
        expr: vmware_host_storage_luns_no_path > 0
        for: 3m
        labels: {severity: critical}
        annotations:
          summary: "{{ $value }} LUN(s) with no live path on {{ $labels.host_name }}"
          description: "Storage access lost (likely APD/PDL)."

      - alert: VMwareHostStoragePathRedundancyLost
        expr: vmware_host_storage_luns_degraded > 0
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} LUN(s) with a single live path on {{ $labels.host_name }}"
          description: "Multipath redundancy lost (fiber, switch, controller...)."

      - alert: VMwareHostStoragePathDead
        expr: vmware_host_storage_paths{state="dead"} > 0
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} dead storage path(s) on {{ $labels.host_name }}"
          description: "Check the host's SAN zoning / links."

      - alert: VMwareHostUplinkDown
        expr: vmware_host_pnic_link_up{used="true"} == 0 and on(vcenter, host_name) (vmware_host_connection_status == 1)
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Uplink {{ $labels.nic }} down on {{ $labels.host_name }}"
          description: "A physical NIC used by a vSwitch/vDS lost its link."

      - alert: VMwareHostCertificateExpiringSoon
        expr: (vmware_host_certificate_expiry_timestamp_seconds - time()) < 30 * 86400
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "Certificate of host {{ $labels.host_name }} expires in {{ $value | humanizeDuration }}"
          description: "Renew the host certificate (VMCA or custom certificate)."

      - alert: VMwareHostSSHEnabled
        expr: vmware_host_service_running{service="TSM-SSH"} == 1
        for: 4h
        labels: {severity: info}
        annotations:
          summary: "SSH enabled on {{ $labels.host_name }} for over 4h"
          description: "SSH should be stopped outside maintenance windows (hardening)."

      - alert: VMwareHostNTPStopped
        expr: vmware_host_service_running{service=~"ntpd|chronyd", policy!="off"} == 0
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "NTP service stopped on {{ $labels.host_name }}"
          description: "Clock drift can break HA, vSAN, authentication and certificates."

      - alert: VMwareHostRebootRequired
        expr: vmware_host_reboot_required == 1
        for: 24h
        labels: {severity: info}
        annotations:
          summary: "Reboot required on {{ $labels.host_name }}"
          description: "A patch or configuration change is pending a reboot."

      - alert: VMwareHostCpuHigh
        expr: vmware_host_cpu_usage_mhz / vmware_host_cpu_total_mhz > 0.90
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "CPU on {{ $labels.host_name }} at {{ $value | humanizePercentage }}"
          description: "Sustained CPU load on the host."

      - alert: VMwareHostMemoryHigh
        expr: vmware_host_memory_usage_bytes / vmware_host_memory_total_bytes > 0.95
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "Memory on {{ $labels.host_name }} at {{ $value | humanizePercentage }}"
          description: "Risk of ballooning / hypervisor swapping."

      - alert: VMwareHostDatastoreLatencyHigh
        expr: max by (vcenter, cluster_name, host_name, perf_instance) ({__name__=~"vmware_host_perf_datastore_total_(read|write)_latency_average_seconds"}) > 0.030
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "High datastore latency on {{ $labels.host_name }} ({{ $value | humanizeDuration }})"
          description: "Average latency > 30 ms to datastore {{ $labels.perf_instance }} (UUID)."

      - alert: VMwareHostNetworkDrops
        expr: vmware_host_perf_net_dropped_rx_summation + vmware_host_perf_net_dropped_tx_summation > 100
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "Dropped packets on {{ $labels.host_name }}"
          description: "{{ $value }} packets dropped per 20 s interval."

  # ---------------------------------------------------------------------------
  - name: vmware-vm
    rules:
      - alert: VMwareVMHeartbeatLost
        expr: vmware_vm_guest_heartbeat_status == 3 and on(vcenter, vm_moid) (vmware_vm_power_status == 1)
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "VM {{ $labels.vm_name }}: guest heartbeat lost"
          description: "The VM is powered on but the guest OS no longer responds to VMware Tools (hung OS?)."

      - alert: VMwareVMToolsNotRunning
        expr: vmware_vm_tools_running == 0 and on(vcenter, vm_moid) (vmware_vm_power_status == 1) and on(vcenter, vm_moid) (vmware_vm_uptime_seconds > 900)
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "VMware Tools not running on {{ $labels.vm_name }}"
          description: "Without VMware Tools: no clean shutdown, no guest monitoring, no quiescing."

      - alert: VMwareVMToolsOutdated
        expr: vmware_vm_tools_version_status{status=~"guestToolsNeedUpgrade|guestToolsTooOld|guestToolsBlacklisted|guestToolsSupportedOld"} == 1
        for: 24h
        labels: {severity: info}
        annotations:
          summary: "VMware Tools need updating on {{ $labels.vm_name }} ({{ $labels.status }})"
          description: "VMware Tools version is outdated."

      - alert: VMwareVMQuestionPending
        expr: vmware_vm_question_pending == 1
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "VM {{ $labels.vm_name }} blocked on a pending question"
          description: "The VM is waiting for an answer in the vSphere Client (often after a copy or a full datastore)."

      - alert: VMwareVMConsolidationNeeded
        expr: vmware_vm_consolidation_needed == 1
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "Disk consolidation needed on {{ $labels.vm_name }}"
          description: "Orphaned delta files remain (interrupted backup?)."

      - alert: VMwareVMSnapshotTooOld
        expr: vmware_vm_snapshot_oldest_age_seconds > 3 * 86400
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "Snapshot older than 3 days on {{ $labels.vm_name }}"
          description: "The oldest snapshot is {{ $value | humanizeDuration }} old. Snapshots are not backups."

      - alert: VMwareVMTooManySnapshots
        expr: vmware_vm_snapshots_existing > 3
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} snapshots on {{ $labels.vm_name }}"
          description: "Long snapshot chains degrade disk performance."

      - alert: VMwareVMGuestDiskFull
        expr: (vmware_vm_guest_disk_free_bytes / vmware_vm_guest_disk_capacity_bytes) < 0.05 and vmware_vm_guest_disk_capacity_bytes > 0
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: "Disk {{ $labels.disk_path }} on {{ $labels.vm_name }} almost full"
          description: "Less than 5% free ({{ $value | humanizePercentage }})."

      - alert: VMwareVMGuestDiskLow
        expr: (vmware_vm_guest_disk_free_bytes / vmware_vm_guest_disk_capacity_bytes) < 0.10 and vmware_vm_guest_disk_capacity_bytes > 0
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "Disk {{ $labels.disk_path }} on {{ $labels.vm_name }} below 10% free"
          description: "Free space: {{ $value | humanizePercentage }}."

      - alert: VMwareVMCpuReadyHigh
        expr: (vmware_vm_perf_cpu_ready_summation_seconds{perf_instance=""} / 20) / ignoring(perf_instance) vmware_vm_vcpus > 0.10
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "High CPU ready on {{ $labels.vm_name }} ({{ $value | humanizePercentage }} per vCPU)"
          description: "The VM is waiting on the ESXi scheduler: CPU contention or too many vCPUs."

      - alert: VMwareVMCoStopHigh
        expr: (vmware_vm_perf_cpu_costop_summation_seconds{perf_instance=""} / 20) / ignoring(perf_instance) vmware_vm_vcpus > 0.03
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "High co-stop on {{ $labels.vm_name }} ({{ $value | humanizePercentage }})"
          description: "Too many vCPUs for the workload: reduce the vCPU count."

      - alert: VMwareVMMemorySwapped
        expr: vmware_vm_memory_swapped_bytes > 0
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "{{ $value | humanize1024 }}B of {{ $labels.vm_name }} memory swapped by the hypervisor"
          description: "Hypervisor swapping: severe VM performance degradation."

      - alert: VMwareVMMemoryBallooned
        expr: vmware_vm_memory_ballooned_bytes > 0
        for: 30m
        labels: {severity: info}
        annotations:
          summary: "Ballooning active on {{ $labels.vm_name }}"
          description: "{{ $value | humanize1024 }}B reclaimed by the balloon driver."

      - alert: VMwareVMDiskLatencyHigh
        expr: vmware_vm_perf_disk_max_total_latency_latest_seconds > 0.050
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "High disk latency on {{ $labels.vm_name }} ({{ $value | humanizeDuration }})"
          description: "Maximum disk latency > 50 ms."

      - alert: VMwareVMNotHAProtected
        expr: vmware_vm_ha_protected == 0 and on(vcenter, vm_moid) (vmware_vm_power_status == 1) and on(vcenter, vm_moid) (vmware_vm_info * on(vcenter, dc_name, cluster_name) group_left() (vmware_cluster_ha_enabled == 1))
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "VM {{ $labels.vm_name }} not protected by HA"
          description: "The VM is powered on in an HA cluster but is not protected."

      - alert: VMwareVMConnectionProblem
        expr: vmware_vm_connection_state > 0
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "VM {{ $labels.vm_name }} in abnormal connection state ({{ $value }})"
          description: "1=disconnected, 2=orphaned, 3=inaccessible, 4=invalid."

  # ---------------------------------------------------------------------------
  - name: vmware-datastore
    rules:
      - alert: VMwareDatastoreAlmostFull
        expr: (1 - vmware_datastore_free_bytes / vmware_datastore_capacity_bytes) > 0.95 and vmware_datastore_capacity_bytes > 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Datastore {{ $labels.ds_name }} {{ $value | humanizePercentage }} full"
          description: "VMs at risk of stopping (thin provisioning, snapshots)."

      - alert: VMwareDatastoreUsageHigh
        expr: (1 - vmware_datastore_free_bytes / vmware_datastore_capacity_bytes) > 0.85 and vmware_datastore_capacity_bytes > 0
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "Datastore {{ $labels.ds_name }} {{ $value | humanizePercentage }} full"
          description: "Plan to free up space or extend the datastore."

      - alert: VMwareDatastoreFullIn7Days
        expr: predict_linear(vmware_datastore_free_bytes[24h], 7 * 86400) < 0 and vmware_datastore_capacity_bytes > 0
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "Datastore {{ $labels.ds_name }} full in less than 7 days"
          description: "Linear projection based on the last 24 h of usage."

      - alert: VMwareDatastoreOverprovisioned
        expr: vmware_datastore_provisioned_bytes / vmware_datastore_capacity_bytes > 2 and vmware_datastore_capacity_bytes > 0
        for: 6h
        labels: {severity: info}
        annotations:
          summary: "Datastore {{ $labels.ds_name }} overprovisioned ({{ $value | humanize }}x)"
          description: "Thin provisioning exceeds 200% of capacity."

      - alert: VMwareDatastoreInaccessible
        expr: vmware_datastore_is_accessible == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "Datastore {{ $labels.ds_name }} inaccessible"
          description: "The datastore is no longer accessible from vCenter {{ $labels.vcenter }}."

      - alert: VMwareDatastoreInaccessibleFromHosts
        expr: vmware_datastore_hosts_inaccessible > 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Datastore {{ $labels.ds_name }} inaccessible from {{ $value }} host(s)"
          description: "Some hosts lost access to the datastore (APD/PDL, storage network)."

      - alert: VMwareDatastoreStatusRed
        expr: vmware_datastore_overall_status == 3
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Datastore {{ $labels.ds_name }} status is red"
          description: "Check the related alarms in the vSphere Client."

  # ---------------------------------------------------------------------------
  - name: vmware-network
    rules:
      - alert: VMwareDVSStatusRed
        expr: vmware_dvs_overall_status == 3
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "vDS {{ $labels.dvs }} status is red"
          description: "Overall status of distributed switch {{ $labels.dvs }} is red."

      - alert: VMwareDVSHostOutOfSync
        expr: vmware_dvs_host_member_up == 0
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Host {{ $labels.host_name }} out of sync with vDS {{ $labels.dvs }}"
          description: "The host is outOfSync, down or in warning state on the vDS."

      - alert: VMwareNetworkInaccessible
        expr: vmware_network_accessible == 0 and vmware_network_hosts > 0
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Network {{ $labels.network }} inaccessible"
          description: "Portgroup {{ $labels.network }} is not accessible from any host."

  # ---------------------------------------------------------------------------
  - name: vmware-vsan
    rules:
      - alert: VMwareVSANHealthRed
        expr: vmware_vsan_cluster_health == 3
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "vSAN health red on {{ $labels.cluster_name }}"
          description: "See vmware_vsan_health_group / vmware_vsan_health_test for details."

      - alert: VMwareVSANHealthYellow
        expr: vmware_vsan_cluster_health == 2
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "vSAN health yellow on {{ $labels.cluster_name }}"
          description: "At least one vSAN health test is in warning."

      - alert: VMwareVSANTestFailed
        expr: vmware_vsan_health_test == 3
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "vSAN {{ $labels.cluster_name }}: health test \"{{ $labels.test }}\" failed"
          description: "Group {{ $labels.group }}."

      - alert: VMwareVSANHealthUnavailable
        expr: vmware_vsan_health_query_success == 0
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "vSAN health unreadable on {{ $labels.cluster_name }}"
          description: "The vSAN health service is not responding or the account lacks permissions."

      - alert: VMwareVSANHealthStale
        expr: time() - vmware_vsan_health_timestamp_seconds > 3 * 3600
        for: 30m
        labels: {severity: info}
        annotations:
          summary: "Stale vSAN health results on {{ $labels.cluster_name }}"
          description: "The last vSAN health check ran {{ $value | humanizeDuration }} ago (check the health service schedule)."
