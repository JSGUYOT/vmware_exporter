# Rule unit tests: promtool test rules vmware-alerts.test.yml
rule_files:
  - vmware-alerts.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'vmware_alarm_triggered{vcenter="vc1",alarm="Host connection and power state",entity="esx01",entity_type="HostSystem",entity_moid="host-1",alarm_moid="alarm-1",dc_name="DC1",status="red",acknowledged="false"}'
        values: '3x10'
      - series: 'vmware_alarm_triggered{vcenter="vc1",alarm="Datastore usage on disk",entity="ds01",entity_type="Datastore",entity_moid="ds-1",alarm_moid="alarm-2",dc_name="DC1",status="red",acknowledged="true"}'
        values: '3x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: VMwareVCenterAlarmCritical
        exp_alerts:
          - exp_labels: {severity: critical, source: vcenter, vcenter: vc1, alarm: "Host connection and power state", entity: esx01, entity_type: HostSystem, entity_moid: host-1, alarm_moid: alarm-1, dc_name: DC1, status: red, acknowledged: "false"}
            exp_annotations:
              summary: "[vc1] Host connection and power state on esx01"
              description: "RED vCenter alarm 'Host connection and power state' on HostSystem esx01 (datacenter DC1)."

  - interval: 1m
    input_series:
      - series: 'vmware_vm_perf_cpu_ready_summation_seconds{vcenter="vc1",dc_name="DC1",vm_name="app01",folder_name="Prod",vm_moid="vm-1",perf_instance=""}'
        values: '8x20'     # 8 s of ready per 20 s
      - series: 'vmware_vm_vcpus{vcenter="vc1",dc_name="DC1",vm_name="app01",folder_name="Prod",vm_moid="vm-1"}'
        values: '2x20'     # => 20% per vCPU
      - series: 'vmware_vm_perf_cpu_ready_summation_seconds{vcenter="vc1",dc_name="DC1",vm_name="db01",folder_name="Prod",vm_moid="vm-2",perf_instance=""}'
        values: '1x20'
      - series: 'vmware_vm_vcpus{vcenter="vc1",dc_name="DC1",vm_name="db01",folder_name="Prod",vm_moid="vm-2"}'
        values: '4x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: VMwareVMCpuReadyHigh
        exp_alerts:
          - exp_labels: {severity: warning, vcenter: vc1, dc_name: DC1, vm_name: app01, folder_name: Prod, vm_moid: vm-1}
            exp_annotations:
              summary: "High CPU ready on app01 (20% per vCPU)"
              description: "The VM is waiting on the ESXi scheduler: CPU contention or too many vCPUs."

  - interval: 1m
    input_series:
      - series: 'vmware_vm_guest_heartbeat_status{vcenter="vc1",dc_name="DC1",vm_name="app01",folder_name="Prod",vm_moid="vm-1"}'
        values: '3x10'
      - series: 'vmware_vm_power_status{vcenter="vc1",dc_name="DC1",vm_name="app01",folder_name="Prod",vm_moid="vm-1"}'
        values: '1x10'
      - series: 'vmware_vm_guest_heartbeat_status{vcenter="vc1",dc_name="DC1",vm_name="off01",folder_name="Prod",vm_moid="vm-3"}'
        values: '3x10'
      - series: 'vmware_vm_power_status{vcenter="vc1",dc_name="DC1",vm_name="off01",folder_name="Prod",vm_moid="vm-3"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: VMwareVMHeartbeatLost
        exp_alerts:
          - exp_labels: {severity: critical, vcenter: vc1, dc_name: DC1, vm_name: app01, folder_name: Prod, vm_moid: vm-1}
            exp_annotations:
              summary: "VM app01: guest heartbeat lost"
              description: "The VM is powered on but the guest OS no longer responds to VMware Tools (hung OS?)."

  - interval: 1m
    input_series:
      - series: 'vmware_host_ha_state{vcenter="vc1",dc_name="DC1",cluster_name="C1",host_name="esx01",state="networkIsolated"}'
        values: '1x20'
      - series: 'vmware_host_in_maintenance{vcenter="vc1",dc_name="DC1",cluster_name="C1",host_name="esx01"}'
        values: '0x20'
      - series: 'vmware_host_ha_state{vcenter="vc1",dc_name="DC1",cluster_name="C1",host_name="esx02",state="connectedToMaster"}'
        values: '1x20'
      - series: 'vmware_host_in_maintenance{vcenter="vc1",dc_name="DC1",cluster_name="C1",host_name="esx02"}'
        values: '0x20'
      - series: 'vmware_host_pnic_link_up{vcenter="vc1",dc_name="DC1",cluster_name="C1",host_name="esx02",nic="vmnic1",used="true",driver="i40en"}'
        values: '0x20'
      - series: 'vmware_host_pnic_link_up{vcenter="vc1",dc_name="DC1",cluster_name="C1",host_name="esx02",nic="vmnic3",used="false",driver="i40en"}'
        values: '0x20'
      - series: 'vmware_host_connection_status{vcenter="vc1",dc_name="DC1",cluster_name="C1",host_name="esx02"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: VMwareHostHAAgentProblem
        exp_alerts:
          - exp_labels: {severity: warning, vcenter: vc1, dc_name: DC1, cluster_name: C1, host_name: esx01, state: networkIsolated}
            exp_annotations:
              summary: "HA agent on esx01 in state networkIsolated"
              description: "The FDM agent is unhealthy (isolation, network partition or initialization error)."
      - eval_time: 15m
        alertname: VMwareHostUplinkDown
        exp_alerts:
          - exp_labels: {severity: warning, vcenter: vc1, dc_name: DC1, cluster_name: C1, host_name: esx02, nic: vmnic1, used: "true", driver: i40en}
            exp_annotations:
              summary: "Uplink vmnic1 down on esx02"
              description: "A physical NIC used by a vSwitch/vDS lost its link."

  - interval: 1m
    input_series:
      # 1 TB datastore losing 1 GB/min: 90% used at 15h
      - series: 'vmware_datastore_free_bytes{vcenter="vc1",dc_name="DC1",ds_name="ds01",datastore_moid="ds-1"}'
        values: '1000000000000-1000000000x900'
      - series: 'vmware_datastore_capacity_bytes{vcenter="vc1",dc_name="DC1",ds_name="ds01",datastore_moid="ds-1"}'
        values: '1000000000000x900'
    alert_rule_test:
      - eval_time: 15h
        alertname: VMwareDatastoreFullIn7Days
        exp_alerts:
          - exp_labels: {severity: warning, vcenter: vc1, dc_name: DC1, ds_name: ds01, datastore_moid: ds-1}
            exp_annotations:
              summary: "Datastore ds01 full in less than 7 days"
              description: "Linear projection based on the last 24 h of usage."
      - eval_time: 15h
        alertname: VMwareDatastoreUsageHigh
        exp_alerts:
          - exp_labels: {severity: warning, vcenter: vc1, dc_name: DC1, ds_name: ds01, datastore_moid: ds-1}
            exp_annotations:
              summary: "Datastore ds01 90% full"
              description: "Plan to free up space or extend the datastore."
      - eval_time: 15h
        alertname: VMwareDatastoreAlmostFull
        exp_alerts: []

  - interval: 1m
    input_series:
      # Fast reads, slow writes: the alert must fire on the write latency
      - series: 'vmware_host_perf_datastore_total_read_latency_average_seconds{vcenter="vc1",dc_name="DC1",cluster_name="C1",host_name="esx01",perf_instance="5f1a-uuid"}'
        values: '0.002x20'
      - series: 'vmware_host_perf_datastore_total_write_latency_average_seconds{vcenter="vc1",dc_name="DC1",cluster_name="C1",host_name="esx01",perf_instance="5f1a-uuid"}'
        values: '0.200x20'
      # HA: percentage-based policy, 15% CPU available vs 25% reserved
      - series: 'vmware_cluster_ha_failover_cpu_resources_percent{vcenter="vc1",dc_name="DC1",cluster_name="C1"}'
        values: '15x20'
      - series: 'vmware_cluster_ha_failover_cpu_resources_configured_percent{vcenter="vc1",dc_name="DC1",cluster_name="C1"}'
        values: '25x20'
      - series: 'vmware_cluster_ha_failover_memory_resources_percent{vcenter="vc1",dc_name="DC1",cluster_name="C1"}'
        values: '40x20'
      - series: 'vmware_cluster_ha_failover_memory_resources_configured_percent{vcenter="vc1",dc_name="DC1",cluster_name="C1"}'
        values: '25x20'
      # Cluster without admission control: no *_configured metric => no alert
      - series: 'vmware_cluster_ha_failover_cpu_resources_percent{vcenter="vc1",dc_name="DC1",cluster_name="C2"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: VMwareHostDatastoreLatencyHigh
        exp_alerts:
          - exp_labels: {severity: warning, vcenter: vc1, cluster_name: C1, host_name: esx01, perf_instance: 5f1a-uuid}
            exp_annotations:
              summary: "High datastore latency on esx01 (200ms)"
              description: "Average latency > 30 ms to datastore 5f1a-uuid (UUID)."
      - eval_time: 16m
        alertname: VMwareClusterHAFailoverCapacityLost
        exp_alerts:
          - exp_labels: {severity: critical, vcenter: vc1, dc_name: DC1, cluster_name: C1}
            exp_annotations:
              summary: "Cluster C1: insufficient HA failover capacity"
              description: "Available failover capacity is below the reserve configured in HA admission control: the cluster can no longer guarantee VM restarts if a host fails."

  - interval: 1m
    input_series:
      - series: 'vmware_appliance_backup_jobs{vcenter="vc1"}'
        values: '0x400'
      - series: 'vmware_appliance_backup_jobs{vcenter="vc2"}'
        values: '3x400'
      - series: 'vmware_appliance_backup_last_success_timestamp_seconds{vcenter="vc2"}'
        values: '0x400'
    alert_rule_test:
      - eval_time: 6h10m
        alertname: VMwareVCenterNoSuccessfulBackup
        exp_alerts:
          - exp_labels: {severity: warning, vcenter: vc1}
            exp_annotations:
              summary: "No known successful backup for vCenter vc1"
              description: "0 known file-based backup job(s), none succeeded. Configure or fix vCenter backups."

  - interval: 1m
    input_series:
      - series: 'vmware_collection_duration_seconds{vcenter="vc1"}'
        values: '50x20'    # 50 s of a 55 s timeout (91%)
      - series: 'vmware_collection_timeout_seconds{vcenter="vc1"}'
        values: '55x20'
      - series: 'vmware_collection_duration_seconds{vcenter="vc2"}'
        values: '60x20'    # 60 s of a 115 s timeout (52%): fine
      - series: 'vmware_collection_timeout_seconds{vcenter="vc2"}'
        values: '115x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: VMwareExporterSlowCollection
        exp_alerts:
          - exp_labels: {severity: info, vcenter: vc1}
            exp_annotations:
              summary: "Slow collection on vc1 (90.91% of the timeout)"
              description: "The collection uses more than 80% of its timeout and risks being cut. Increase 'interval'/'timeout' or reduce the scope (filters, perf counters)."
