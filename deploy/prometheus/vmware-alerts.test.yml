# Tests unitaires des règles : promtool test rules vmware-alerts.test.yml
rule_files:
  - vmware-alerts.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'vmware_alarm_triggered{vcenter="vc1",alarm="Host connection and power state",entity="esx01",entity_type="HostSystem",entity_moid="host-1",alarm_moid="alarm-1",datacenter="DC1",status="red",acknowledged="false"}'
        values: '3x10'
      - series: 'vmware_alarm_triggered{vcenter="vc1",alarm="Datastore usage on disk",entity="ds01",entity_type="Datastore",entity_moid="ds-1",alarm_moid="alarm-2",datacenter="DC1",status="red",acknowledged="true"}'
        values: '3x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: VMwareVCenterAlarmCritical
        exp_alerts:
          - exp_labels: {severity: critical, source: vcenter, vcenter: vc1, alarm: "Host connection and power state", entity: esx01, entity_type: HostSystem, entity_moid: host-1, alarm_moid: alarm-1, datacenter: DC1, status: red, acknowledged: "false"}
            exp_annotations:
              summary: "[vc1] Host connection and power state sur esx01"
              description: "Alarme vCenter ROUGE 'Host connection and power state' sur HostSystem esx01 (datacenter DC1)."

  - interval: 1m
    input_series:
      - series: 'vmware_vm_perf_cpu_ready_summation_seconds{vcenter="vc1",datacenter="DC1",vm="app01",vm_moid="vm-1",perf_instance=""}'
        values: '8x20'     # 8 s de ready sur 20 s
      - series: 'vmware_vm_vcpus{vcenter="vc1",datacenter="DC1",vm="app01",vm_moid="vm-1"}'
        values: '2x20'     # => 20 % par vCPU
      - series: 'vmware_vm_perf_cpu_ready_summation_seconds{vcenter="vc1",datacenter="DC1",vm="db01",vm_moid="vm-2",perf_instance=""}'
        values: '1x20'
      - series: 'vmware_vm_vcpus{vcenter="vc1",datacenter="DC1",vm="db01",vm_moid="vm-2"}'
        values: '4x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: VMwareVMCpuReadyHigh
        exp_alerts:
          - exp_labels: {severity: warning, vcenter: vc1, datacenter: DC1, vm: app01, vm_moid: vm-1}
            exp_annotations:
              summary: "CPU ready élevé sur app01 (20% par vCPU)"
              description: "La VM attend l'ordonnanceur ESX : contention CPU ou trop de vCPU."

  - interval: 1m
    input_series:
      - series: 'vmware_vm_guest_heartbeat_status{vcenter="vc1",datacenter="DC1",vm="app01",vm_moid="vm-1"}'
        values: '3x10'
      - series: 'vmware_vm_power_state{vcenter="vc1",datacenter="DC1",vm="app01",vm_moid="vm-1"}'
        values: '1x10'
      - series: 'vmware_vm_guest_heartbeat_status{vcenter="vc1",datacenter="DC1",vm="off01",vm_moid="vm-3"}'
        values: '3x10'
      - series: 'vmware_vm_power_state{vcenter="vc1",datacenter="DC1",vm="off01",vm_moid="vm-3"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: VMwareVMHeartbeatLost
        exp_alerts:
          - exp_labels: {severity: critical, vcenter: vc1, datacenter: DC1, vm: app01, vm_moid: vm-1}
            exp_annotations:
              summary: "VM app01 : heartbeat invité perdu"
              description: "La VM est allumée mais l'OS invité ne répond plus aux VMware Tools (OS figé ?)."

  - interval: 1m
    input_series:
      - series: 'vmware_host_ha_state{vcenter="vc1",datacenter="DC1",cluster="C1",host="esx01",state="networkIsolated"}'
        values: '1x20'
      - series: 'vmware_host_maintenance_mode{vcenter="vc1",datacenter="DC1",cluster="C1",host="esx01"}'
        values: '0x20'
      - series: 'vmware_host_ha_state{vcenter="vc1",datacenter="DC1",cluster="C1",host="esx02",state="connectedToMaster"}'
        values: '1x20'
      - series: 'vmware_host_maintenance_mode{vcenter="vc1",datacenter="DC1",cluster="C1",host="esx02"}'
        values: '0x20'
      - series: 'vmware_host_pnic_link_up{vcenter="vc1",datacenter="DC1",cluster="C1",host="esx02",nic="vmnic1",used="true",driver="i40en"}'
        values: '0x20'
      - series: 'vmware_host_pnic_link_up{vcenter="vc1",datacenter="DC1",cluster="C1",host="esx02",nic="vmnic3",used="false",driver="i40en"}'
        values: '0x20'
      - series: 'vmware_host_connection_state{vcenter="vc1",datacenter="DC1",cluster="C1",host="esx02"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: VMwareHostHAAgentProblem
        exp_alerts:
          - exp_labels: {severity: warning, vcenter: vc1, datacenter: DC1, cluster: C1, host: esx01, state: networkIsolated}
            exp_annotations:
              summary: "Agent HA de esx01 en état networkIsolated"
              description: "L'agent FDM n'est pas sain (isolation, partition réseau ou erreur d'initialisation)."
      - eval_time: 15m
        alertname: VMwareHostUplinkDown
        exp_alerts:
          - exp_labels: {severity: warning, vcenter: vc1, datacenter: DC1, cluster: C1, host: esx02, nic: vmnic1, used: "true", driver: i40en}
            exp_annotations:
              summary: "Uplink vmnic1 down sur esx02"
              description: "Une carte réseau physique utilisée par un vSwitch/vDS a perdu son lien."

  - interval: 1m
    input_series:
      # Datastore de 1 To perdant 1 Go/min : 90 % utilisé à 15 h
      - series: 'vmware_datastore_free_bytes{vcenter="vc1",datacenter="DC1",datastore="ds01",datastore_moid="ds-1"}'
        values: '1000000000000-1000000000x900'
      - series: 'vmware_datastore_capacity_bytes{vcenter="vc1",datacenter="DC1",datastore="ds01",datastore_moid="ds-1"}'
        values: '1000000000000x900'
    alert_rule_test:
      - eval_time: 15h
        alertname: VMwareDatastoreFullIn7Days
        exp_alerts:
          - exp_labels: {severity: warning, vcenter: vc1, datacenter: DC1, datastore: ds01, datastore_moid: ds-1}
            exp_annotations:
              summary: "Datastore ds01 plein dans moins de 7 jours"
              description: "Projection linéaire sur 24 h de consommation."
      - eval_time: 15h
        alertname: VMwareDatastoreUsageHigh
        exp_alerts:
          - exp_labels: {severity: warning, vcenter: vc1, datacenter: DC1, datastore: ds01, datastore_moid: ds-1}
            exp_annotations:
              summary: "Datastore ds01 rempli à 90%"
              description: "Planifier une libération d'espace ou une extension."
      - eval_time: 15h
        alertname: VMwareDatastoreAlmostFull
        exp_alerts: []

  - interval: 1m
    input_series:
      # Lecture rapide, écriture lente : l'alerte doit se déclencher sur l'écriture
      - series: 'vmware_host_perf_datastore_total_read_latency_average_seconds{vcenter="vc1",datacenter="DC1",cluster="C1",host="esx01",perf_instance="5f1a-uuid"}'
        values: '0.002x20'
      - series: 'vmware_host_perf_datastore_total_write_latency_average_seconds{vcenter="vc1",datacenter="DC1",cluster="C1",host="esx01",perf_instance="5f1a-uuid"}'
        values: '0.200x20'
      # HA : politique en pourcentage, 15 % CPU disponibles pour 25 % réservés
      - series: 'vmware_cluster_ha_failover_cpu_resources_percent{vcenter="vc1",datacenter="DC1",cluster="C1"}'
        values: '15x20'
      - series: 'vmware_cluster_ha_failover_cpu_resources_configured_percent{vcenter="vc1",datacenter="DC1",cluster="C1"}'
        values: '25x20'
      - series: 'vmware_cluster_ha_failover_memory_resources_percent{vcenter="vc1",datacenter="DC1",cluster="C1"}'
        values: '40x20'
      - series: 'vmware_cluster_ha_failover_memory_resources_configured_percent{vcenter="vc1",datacenter="DC1",cluster="C1"}'
        values: '25x20'
      # Cluster sans contrôle d'admission : pas de métrique *_configured => pas d'alerte
      - series: 'vmware_cluster_ha_failover_cpu_resources_percent{vcenter="vc1",datacenter="DC1",cluster="C2"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: VMwareHostDatastoreLatencyHigh
        exp_alerts:
          - exp_labels: {severity: warning, vcenter: vc1, cluster: C1, host: esx01, perf_instance: 5f1a-uuid}
            exp_annotations:
              summary: "Latence datastore élevée sur esx01 (200ms)"
              description: "Latence moyenne > 30 ms vers le datastore 5f1a-uuid (UUID)."
      - eval_time: 16m
        alertname: VMwareClusterHAFailoverCapacityLost
        exp_alerts:
          - exp_labels: {severity: critical, vcenter: vc1, datacenter: DC1, cluster: C1}
            exp_annotations:
              summary: "Cluster C1 : capacité de bascule HA insuffisante"
              description: "La capacité de basculement disponible est inférieure à la réserve configurée dans le contrôle d'admission HA : le cluster ne garantit plus le redémarrage des VMs en cas de panne d'ESX."

  - interval: 1m
    input_series:
      - series: 'vmware_appliance_backup_jobs{vcenter="vc1"}'
        values: '0x400'
      - series: 'vmware_appliance_backup_jobs{vcenter="vc2"}'
        values: '3x400'
      - series: 'vmware_appliance_backup_last_success_timestamp_seconds{vcenter="vc2"}'
        values: '0x400'
    alert_rule_test:
      - eval_time: 6h10m
        alertname: VMwareVCenterNoSuccessfulBackup
        exp_alerts:
          - exp_labels: {severity: warning, vcenter: vc1}
            exp_annotations:
              summary: "Aucune sauvegarde réussie connue pour le vCenter vc1"
              description: "0 job(s) de sauvegarde file-based connus, aucun réussi. Configurer ou réparer la sauvegarde du vCenter."
