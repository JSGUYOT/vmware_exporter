# Weekly dependency updates, proposed as pull requests on the development
# branch (dev); they reach main through the usual dev -> main merge.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    target-branch: dev
    vendor: true          # vendor/ is regenerated in the same pull request
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
