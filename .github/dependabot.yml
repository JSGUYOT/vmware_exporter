# Weekly dependency updates, proposed as pull requests on the development
# branch (V1.0); they reach main through the usual V1.0 -> main merge.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    target-branch: V1.0
    vendor: true          # vendor/ is regenerated in the same pull request
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: V1.0
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    target-branch: V1.0
    schedule:
      interval: weekly
