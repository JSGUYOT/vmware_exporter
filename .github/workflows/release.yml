name: Release

# Push a tag matching the VERSION file to publish a release, e.g.:
#   git tag v$(cat VERSION) && git push origin v$(cat VERSION)
# A tag with a suffix, such as v$(cat VERSION)-rc.1, publishes a pre-release (any branch,
# e.g. dev): no dated CHANGELOG entry needed, notes from the "main / unreleased" section.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  PROMU_VERSION: "v0.20.0"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Tag matches the VERSION file
        id: tag
        run: |
          base="v$(cat VERSION)"
          case "${GITHUB_REF_NAME}" in
            "${base}") echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
            "${base}"-?*)
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
              # Archives and binaries carry the pre-release version (not committed)
              echo "${GITHUB_REF_NAME#v}" > VERSION ;;
            *) echo "tag ${GITHUB_REF_NAME} does not match VERSION ${base#v}"; exit 1 ;;
          esac
      - run: go install github.com/prometheus/promu@${PROMU_VERSION}
      - name: CHANGELOG.md has an entry for this version
        if: steps.tag.outputs.prerelease == 'false'
        run: promu check changelog
      - run: make test
      - run: make release-tarballs
      - name: Release notes from CHANGELOG.md
        run: |
          if [ "${{ steps.tag.outputs.prerelease }}" = true ]; then
            { echo "Pre-release built from \`${GITHUB_SHA::7}\`, not a supported version."
              echo
              awk '$0 == "## main / unreleased" {on=1; next} /^## / {on=0} on' CHANGELOG.md
            } > .release-notes.md
          else
            awk -v v="## $(cat VERSION) " 'index($0, v) == 1 {on=1; next} /^## / {on=0} on' CHANGELOG.md > .release-notes.md
          fi
          test -s .release-notes.md || { echo "no release notes found in CHANGELOG.md"; exit 1; }
          cat .release-notes.md
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          [ "${{ steps.tag.outputs.prerelease }}" = true ] && flags+=(--prerelease)
          gh release create "${GITHUB_REF_NAME}" .tarballs/* --verify-tag "${flags[@]}" \
            --notes-file .release-notes.md --title "${GITHUB_REF_NAME}"
