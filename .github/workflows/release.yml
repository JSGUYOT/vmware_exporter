name: Release

# Push a tag matching the VERSION file to publish a release, e.g.:
#   git tag v$(cat VERSION) && git push origin v$(cat VERSION)
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  PROMU_VERSION: "v0.20.0"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Tag matches the VERSION file
        run: |
          test "${GITHUB_REF_NAME}" = "v$(cat VERSION)" || {
            echo "tag ${GITHUB_REF_NAME} does not match VERSION $(cat VERSION)"; exit 1; }
      - run: go install github.com/prometheus/promu@${PROMU_VERSION}
      - name: CHANGELOG.md has an entry for this version
        run: promu check changelog
      - run: make test
      - run: make release-tarballs
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="## $(cat VERSION) " 'index($0, v) == 1 {on=1; next} /^## / {on=0} on' CHANGELOG.md > .release-notes.md
          cat .release-notes.md
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" .tarballs/* --verify-tag --notes-file .release-notes.md --title "${GITHUB_REF_NAME}"
